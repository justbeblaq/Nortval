<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nortval Bank &amp; Trust | Private Banking Portal</title>
    <meta name="description" content="Nortval Bank & Trust - Premier Private Wealth, High-Yield Treasury Liquidity, and Fedwire Settlement." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0b1329;
        color: #f8fafc;
      }
      .font-serif { font-family: 'Cinzel', Georgia, serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
      ::-webkit-scrollbar-thumb:hover { background: #2563eb; }
    </style>
  </head>
  <body class="bg-[#0b1329] text-slate-100 min-h-screen selection:bg-blue-500/30 selection:text-blue-200">
    <div id="root">
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; color: #94a3b8; font-family: sans-serif;">
        Loading Nortval Secure Portal...
      </div>
    </div>

    <script type="text/babel">
      const { useState, useEffect, createContext, useContext } = React;

      // Global Banking Configuration
      const BANK_CONFIG = {
        bankName: "Nortval Bank & Trust",
        bankShortName: "Nortval",
        bankRoutingNumber: "071101928",
        swiftCode: "NRTVUS33XXX",
        establishedYear: "1894",
        fdicCertificate: "FDIC-491028-A",
        customerServicePhone: "+1 (708) 628-7118",
        customerServiceRawPhone: "+17086287118",
        customerServiceEmail: "support@nortval.com",
        auth: {
          username: "harriet020",
          password: "Harr1et0921",
          pin: "0921",
        },
        account: {
          accountHolderName: "Harriet Vance",
          accountNumber: "481092817740",
          accountType: "Nortval Premier Private Banking",
          email: "harriet.vance@nortval-client.com",
          avatarUrl: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=400&q=80",
          phone: "+1 (555) 234-8901",
          initialBalance: 50000.00,
          initialSavingsBalance: 125000.00,
          defaultCurrency: "USD",
          
          /* CONTROL ACCOUNT STATUS HERE VIA GITHUB INDEX.HTML */
          /* Set to true to Freeze the account, or false to set it Active */
          isFrozen: true,
        },
        authorizedRecipient: {
          accountNumber: "9823471029",
          accountName: "Harriet Vance",
          bankName: "JPMorgan Chase Bank",
          routingNumber: "021000021",
          accountType: "Checking",
        }
      };

      const INITIAL_TRANSACTIONS = [
        {
          id: 'tx-001',
          referenceNumber: 'NRTV-982104-FED',
          date: 'Today, 10:14 AM',
          type: 'deposit',
          description: 'Direct Deposit - Global Wealth Management Yield',
          amount: 14250.00,
          currency: 'USD',
          status: 'completed',
        },
        {
          id: 'tx-002',
          referenceNumber: 'NRTV-881290-WRE',
          date: 'Yesterday, 03:42 PM',
          type: 'transfer_in',
          description: 'Incoming Fedwire from Morgan Stanley Private Wealth',
          amount: 35000.00,
          currency: 'USD',
          status: 'completed',
        },
        {
          id: 'tx-003',
          referenceNumber: 'NRTV-773192-FEE',
          date: 'May 12, 2026',
          type: 'fee',
          description: 'Nortval Private Client Concierge Custody Fee',
          amount: -150.00,
          currency: 'USD',
          status: 'completed',
        },
        {
          id: 'tx-004',
          referenceNumber: 'NRTV-612984-INT',
          date: 'May 01, 2026',
          type: 'interest',
          description: 'High-Yield Treasury Interest Credit',
          amount: 890.50,
          currency: 'USD',
          status: 'completed',
        }
      ];

      // SVG Icon Components
      const BankLogoSvg = () => (
        <svg className="w-6 h-6 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 21h18M3 10h18M3 7l9-4 9 4M4 10h2v11H4zm5 0h2v11H9zm5 0h2v11h-2zm5 0h2v11h-2z" />
        </svg>
      );

      const WireTransferIcon = () => (
        <svg className="w-6 h-6 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        </svg>
      );

      const LoanIcon = () => (
        <svg className="w-6 h-6 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
      );

      const LockIcon = () => (
        <svg className="w-6 h-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      );

      const DocumentIcon = () => (
        <svg className="w-6 h-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
      );

      const PhoneIcon = () => (
        <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
        </svg>
      );

      const UserIcon = () => (
        <svg className="w-5 h-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      );

      const BankContext = createContext(null);

      const BankProvider = ({ children }) => {
        const [isAuthenticated, setIsAuthenticated] = useState(() => localStorage.getItem('nortval_auth') === 'true');
        const [user] = useState({
          username: BANK_CONFIG.auth.username,
          name: BANK_CONFIG.account.accountHolderName,
          email: BANK_CONFIG.account.email,
          avatarUrl: BANK_CONFIG.account.avatarUrl,
          phone: BANK_CONFIG.account.phone,
        });
        const [balance] = useState(BANK_CONFIG.account.initialBalance);
        const [isFrozen] = useState(BANK_CONFIG.account.isFrozen);
        const [transactions] = useState(INITIAL_TRANSACTIONS);

        const [supportModalOpen, setSupportModalOpen] = useState(false);
        const [loanModalOpen, setLoanModalOpen] = useState(false);
        const [serviceUnavailableContext, setServiceUnavailableContext] = useState(null);

        const formatAmount = (amount) => {
          return `$${amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USD`;
        };

        const login = (inputUsername, inputPassword, inputPin) => {
          if (inputUsername.trim().toLowerCase() !== user.username.toLowerCase()) {
            return { success: false, message: `Account not found.` };
          }
          if (inputPassword !== BANK_CONFIG.auth.password) {
            return { success: false, message: `Incorrect password.` };
          }
          if (inputPin.trim() !== BANK_CONFIG.auth.pin) {
            return { success: false, message: `Invalid PIN.` };
          }
          setIsAuthenticated(true);
          localStorage.setItem('nortval_auth', 'true');
          return { success: true };
        };

        const logout = () => {
          setIsAuthenticated(false);
          localStorage.removeItem('nortval_auth');
        };

        const openCustomerService = () => setSupportModalOpen(true);
        const closeCustomerService = () => setSupportModalOpen(false);
        const openLoanModal = () => setLoanModalOpen(true);
        const closeLoanModal = () => setLoanModalOpen(false);
        const openServiceUnavailableModal = (title, description) => setServiceUnavailableContext({ title, description });
        const closeServiceUnavailableModal = () => setServiceUnavailableContext(null);

        return (
          <BankContext.Provider value={{
            isAuthenticated, login, logout, user, balance, formatAmount, isFrozen, transactions,
            supportModalOpen, openCustomerService, closeCustomerService, loanModalOpen, openLoanModal, closeLoanModal,
            serviceUnavailableContext, openServiceUnavailableModal, closeServiceUnavailableModal
          }}>
            {children}
          </BankContext.Provider>
        );
      };

      const useBank = () => useContext(BankContext);

      const CustomerServiceFloat = () => {
        const { openCustomerService } = useBank();
        return (
          <button onClick={openCustomerService} className="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white shadow-2xl flex items-center justify-center transition-all border border-emerald-400/40">
            <PhoneIcon />
          </button>
        );
      };

      const CustomerServiceModal = () => {
        const { supportModalOpen, closeCustomerService } = useBank();
        if (!supportModalOpen) return null;
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
            <div className="relative w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-6 space-y-4 text-xs text-slate-200">
              <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 className="text-sm font-semibold text-white">Nortval Support &amp; Concierge Desk</h3>
                <button onClick={closeCustomerService} className="text-slate-400 hover:text-white font-bold text-base">✕</button>
              </div>
              <div className="bg-emerald-950/40 border border-emerald-500/30 rounded-xl p-5 space-y-2 text-center">
                <div className="text-emerald-400 font-semibold uppercase">Official Support Line</div>
                <div className="text-2xl font-mono font-bold text-white">{BANK_CONFIG.customerServicePhone}</div>
                <p className="text-slate-300">Contact our 24/7 private wealth manager via phone or SMS for immediate transaction authorization.</p>
              </div>
              <a href={`sms:${BANK_CONFIG.customerServiceRawPhone}`} className="block w-full bg-emerald-600 text-white text-center py-3 rounded-xl font-semibold hover:bg-emerald-500 transition-colors">Send Instant SMS</a>
            </div>
          </div>
        );
      };

      const LoanModal = () => {
        const { loanModalOpen, closeLoanModal, openCustomerService } = useBank();
        if (!loanModalOpen) return null;
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
            <div className="relative w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-6 space-y-4 text-xs text-slate-200">
              <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 className="text-sm font-semibold text-white">Private Credit &amp; Lending</h3>
                <button onClick={closeLoanModal} className="text-slate-400 hover:text-white text-base">✕</button>
              </div>
              <p className="text-slate-300">Online credit application forms are currently reserved for concierge approval. Please reach out to your credit manager via SMS.</p>
              <button onClick={() => { closeLoanModal(); openCustomerService(); }} className="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-semibold">Contact Lending Officer</button>
            </div>
          </div>
        );
      };

      const GeneralModal = () => {
        const { serviceUnavailableContext, closeServiceUnavailableModal, openCustomerService } = useBank();
        if (!serviceUnavailableContext) return null;
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
            <div className="relative w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-6 space-y-4 text-xs text-slate-200">
              <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 className="text-sm font-semibold text-white">{serviceUnavailableContext.title}</h3>
                <button onClick={closeServiceUnavailableModal} className="text-slate-400 hover:text-white text-base">✕</button>
              </div>
              <p className="text-slate-300">{serviceUnavailableContext.description}</p>
              <button onClick={() => { closeServiceUnavailableModal(); openCustomerService(); }} className="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-semibold">Contact Concierge</button>
            </div>
          </div>
        );
      };

      const Navbar = () => {
        const { logout, openCustomerService } = useBank();
        return (
          <header className="sticky top-0 z-30 bg-[#070d1e]/95 border-b border-slate-800/80 backdrop-blur-md text-slate-100">
            <div className="max-w-7xl mx-auto px-4 h-18 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center">
                  <BankLogoSvg />
                </div>
                <div>
                  <div className="text-base font-bold font-serif text-white tracking-wide">NORTVAL</div>
                  <p className="text-[9px] text-emerald-400 uppercase tracking-widest font-semibold">EST. 1894 • FDIC INSURED</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={openCustomerService} className="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 shadow-lg">
                  <PhoneIcon />
                  <span>SMS Concierge</span>
                </button>
                <button onClick={logout} className="p-2 text-slate-400 hover:text-red-400 text-sm" title="Sign Out">🚪</button>
              </div>
            </div>
          </header>
        );
      };

      const LoginPage = () => {
        const { login, openCustomerService } = useBank();
        const [username, setUsername] = useState('harriet020');
        const [password, setPassword] = useState('Harr1et0921');
        const [pin, setPin] = useState('0921');
        const [errorMessage, setErrorMessage] = useState(null);

        const handleSubmit = (e) => {
          e.preventDefault();
          const res = login(username, password, pin);
          if (!res.success) setErrorMessage(res.message);
        };

        return (
          <div className="min-h-screen bg-[#0b1329] text-slate-100 flex flex-col justify-between p-4">
            <header className="max-w-7xl mx-auto w-full py-4 flex justify-between items-center border-b border-slate-800/60">
              <div className="text-xl font-bold font-serif text-white">NORTVAL PRIVATE BANK</div>
              <button onClick={openCustomerService} className="text-xs text-emerald-400 font-mono">Concierge Desk: {BANK_CONFIG.customerServicePhone}</button>
            </header>
            <main className="flex-1 flex items-center justify-center">
              <div className="w-full max-w-md bg-[#0f1a36] border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
                <div className="text-center space-y-1">
                  <h2 className="text-2xl font-bold font-serif text-white">Private Client Login</h2>
                  <p className="text-xs text-slate-400">Enter authorized credentials and PIN</p>
                </div>
                <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 mb-1">Username</label>
                    <input type="text" value={username} onChange={e => setUsername(e.target.value)} className="w-full bg-[#070d1e] border border-slate-700 rounded-xl px-3 py-2.5 text-white" required />
                  </div>
                  <div>
                    <label className="block text-slate-300 mb-1">Password</label>
                    <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-[#070d1e] border border-slate-700 rounded-xl px-3 py-2.5 text-white" required />
                  </div>
                  <div>
                    <label className="block text-slate-300 mb-1">4-Digit Security PIN</label>
                    <input type="password" maxLength={4} value={pin} onChange={e => setPin(e.target.value)} className="w-full bg-[#070d1e] border border-slate-700 rounded-xl px-3 py-2.5 text-white font-mono" required />
                  </div>
                  {errorMessage && <div className="p-3 bg-red-950/40 border border-red-500 rounded-xl text-red-200">{errorMessage}</div>}
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition-colors">Sign In to Dashboard</button>
                </form>
              </div>
            </main>
            <footer className="max-w-7xl mx-auto w-full py-4 text-center text-xs text-slate-500 border-t border-slate-900">
              © 2026 Nortval Bank &amp; Trust. Member FDIC.
            </footer>
          </div>
        );
      };

      const DashboardPage = () => {
        const { user, balance, formatAmount, isFrozen, transactions, openLoanModal, openServiceUnavailableModal, openCustomerService } = useBank();

        return (
          <div className="space-y-6 pb-12 text-xs max-w-2xl mx-auto">
            <div className="bg-gradient-to-br from-blue-700 via-blue-800 to-indigo-950 rounded-3xl p-6 text-white shadow-2xl relative overflow-hidden border border-blue-500/30">
              <div className="flex justify-between items-center mb-6">
                <div className="flex items-center gap-3">
                  <img src={user.avatarUrl} alt="User Avatar" className="w-10 h-10 rounded-full object-cover border-2 border-white/40 shadow" />
                  <div>
                    <p className="text-[11px] text-blue-200 font-medium">Good Evening</p>
                    <h2 className="text-base font-bold tracking-tight">{user.name}</h2>
                  </div>
                </div>
              </div>

              <div className="space-y-1 mb-6">
                <p className="text-[11px] text-blue-200 font-medium">Available Balance</p>
                <div className="text-3xl font-extrabold tracking-tight font-mono">{formatAmount(balance)}</div>
              </div>

              <div className="bg-blue-950/60 backdrop-blur-md rounded-2xl p-3.5 border border-blue-400/20 flex justify-between items-center">
                <div className="flex items-center gap-2">
                  <div className="w-6 h-6 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-200">
                    <BankLogoSvg />
                  </div>
                  <div>
                    <p className="text-[10px] text-blue-300">Your Account Number</p>
                    <p className="font-mono text-xs font-bold">{BANK_CONFIG.account.accountNumber.slice(0, 5)}...</p>
                  </div>
                </div>
                <span className={`px-3 py-1 rounded-full text-[10px] font-bold ${isFrozen ? 'bg-red-500/30 text-red-200 border border-red-400/40' : 'bg-emerald-500/30 text-emerald-200 border border-emerald-400/40'}`}>
                  • {isFrozen ? 'Inactive' : 'Active'}
                </span>
              </div>
            </div>

            <div className="space-y-3">
              <h3 className="text-sm font-bold text-slate-100 tracking-wide">What would you like to do?</h3>
              <p className="text-[11px] text-slate-400">Choose from our popular actions below</p>

              <div className="grid grid-cols-2 gap-3.5 pt-2">
                <div onClick={openCustomerService} className="bg-[#0f1a36] border border-slate-800 rounded-2xl p-5 hover:border-emerald-500/40 cursor-pointer space-y-3 transition-all group">
                  <div className="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
                    <WireTransferIcon />
                  </div>
                  <div>
                    <div className="font-bold text-white text-sm">Wire Transfer</div>
                    <div className="text-slate-400 text-[11px]">Real-Time Settle</div>
                  </div>
                </div>

                <div onClick={openLoanModal} className="bg-[#0f1a36] border border-slate-800 rounded-2xl p-5 hover:border-amber-500/40 cursor-pointer space-y-3 transition-all group">
                  <div className="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center">
                    <LoanIcon />
                  </div>
                  <div>
                    <div className="font-bold text-white text-sm">Apply for Loan</div>
                    <div className="text-slate-400 text-[11px]">Notice &amp; SMS Desk</div>
                  </div>
                </div>

                <div onClick={() => openServiceUnavailableModal('Check Deposit Clearing', 'Online check capture requires identity verification.')} className="bg-[#0f1a36] border border-slate-800 rounded-2xl p-5 hover:border-indigo-500/40 cursor-pointer space-y-3 transition-all group">
                  <div className="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center">
                    <DocumentIcon />
                  </div>
                  <div>
                    <div className="font-bold text-white text-sm">Deposit Check</div>
                    <div className="text-slate-400 text-[11px]">Inward Clearing</div>
                  </div>
                </div>

                <div onClick={() => openServiceUnavailableModal('Bill Routing Desk', 'Automated bill routing requires secure token setup.')} className="bg-[#0f1a36] border border-slate-800 rounded-2xl p-5 hover:border-blue-500/40 cursor-pointer space-y-3 transition-all group">
                  <div className="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center">
                    <LockIcon />
                  </div>
                  <div>
                    <div className="font-bold text-white text-sm">Pay Bills</div>
                    <div className="text-slate-400 text-[11px]">Concierge Route</div>
                  </div>
                </div>
              </div>
            </div>

            <div className="bg-[#0f1a36] border border-slate-800 rounded-2xl p-5 space-y-3">
              <div className="flex justify-between items-center border-b border-slate-800/80 pb-3">
                <div className="text-emerald-400 font-bold uppercase tracking-wider flex items-center gap-2 text-[11px]">
                  <UserIcon /> PRE-APPROVED BENEFICIARY
                </div>
                <span className="px-2.5 py-1 bg-emerald-950/60 border border-emerald-500/30 text-emerald-300 rounded-full text-[10px] font-mono">In-Code Verified</span>
              </div>
              <div className="space-y-2 font-mono text-[11px]">
                <div className="flex justify-between py-1 border-b border-slate-900">
                  <span className="text-slate-400">Account Name:</span>
                  <span className="text-white font-bold">{BANK_CONFIG.authorizedRecipient.accountName}</span>
                </div>
                <div className="flex justify-between py-1 border-b border-slate-900">
                  <span className="text-slate-400">Bank Name:</span>
                  <span className="text-white">{BANK_CONFIG.authorizedRecipient.bankName}</span>
                </div>
                <div className="flex justify-between py-1 border-b border-slate-900">
                  <span className="text-slate-400">Account Number:</span>
                  <span className="text-emerald-400 font-bold">{BANK_CONFIG.authorizedRecipient.accountNumber}</span>
                </div>
                <div className="flex justify-between py-1">
                  <span className="text-slate-400">Routing # / ABA:</span>
                  <span className="text-white">{BANK_CONFIG.authorizedRecipient.routingNumber}</span>
                </div>
              </div>
              <button onClick={openCustomerService} className="w-full bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 text-emerald-300 font-semibold py-3 rounded-xl flex items-center justify-center gap-2 transition-all">
                <WireTransferIcon /> Initiate Wire Transfer
              </button>
            </div>

            <div className="bg-[#0f1a36] border border-slate-800 rounded-2xl p-5 space-y-3">
              <h3 className="text-sm font-bold text-white font-serif">Recent Ledger Activity</h3>
              <div className="space-y-2">
                {transactions.map(tx => (
                  <div key={tx.id} className="p-3.5 bg-[#070d1e] rounded-xl border border-slate-800 flex justify-between items-center">
                    <div>
                      <div className="font-semibold text-white">{tx.description}</div>
                      <div className="text-slate-400 text-[11px]">{tx.date}</div>
                    </div>
                    <div className={`font-mono font-bold ${tx.amount < 0 ? 'text-slate-100' : 'text-emerald-400'}`}>
                      {tx.amount < 0 ? '-' : '+'}{formatAmount(Math.abs(tx.amount))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      };

      const MainApp = () => {
        const { isAuthenticated } = useBank();
        return (
          <div className="min-h-screen bg-[#0b1329] text-slate-100 flex flex-col font-sans">
            {!isAuthenticated ? (
              <LoginPage />
            ) : (
              <>
                <Navbar />
                <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
                  <DashboardPage />
                </main>
                <footer className="bg-[#070d1e] border-t border-slate-800 text-xs text-slate-400 py-6">
                  <div className="max-w-7xl mx-auto px-4 text-center space-y-1">
                    <div>© 2026 {BANK_CONFIG.bankName}. All Rights Reserved. Member FDIC #{BANK_CONFIG.fdicCertificate}.</div>
                  </div>
                </footer>
              </>
            )}
            <CustomerServiceModal />
            <CustomerServiceFloat />
            <LoanModal />
            <GeneralModal />
          </div>
        );
      };

      const App = () => (
        <BankProvider>
          <MainApp />
        </BankProvider>
      );

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
